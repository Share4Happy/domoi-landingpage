<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 500" width="100%" height="100%">
  <defs>
    <linearGradient id="domBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFDF9" />
      <stop offset="100%" stop-color="#FDE8C7" />
    </linearGradient>
  </defs>

  <rect width="400" height="500" rx="20" fill="url(#domBg)" />

  <!-- Sheet Guide Lines -->
  <g stroke="#604826" stroke-opacity="0.08" stroke-width="1">
    <line x1="40" y1="120" x2="360" y2="120" stroke-dasharray="4" />
    <line x1="40" y1="260" x2="360" y2="260" stroke-dasharray="4" />
    <line x1="40" y1="380" x2="360" y2="380" stroke-dasharray="4" />
  </g>

  <!-- Tag / Title -->
  <text x="30" y="45" font-family="'Quicksand', sans-serif" font-weight="700" font-size="18" fill="#604826">
    Chú Chó Đốm 🐾
  </text>
  <text x="30" y="68" font-family="'Nunito', sans-serif" font-size="12" fill="#8B9DA8">
    Đặc điểm: Lông tơ xù trắng đốm nâu, trung thành, linh hồn cảm xúc của phim
  </text>

  <!-- Dog Main Pose (Front-Standing) -->
  <g transform="translate(130, 110)">
    <!-- Shadow -->
    <ellipse cx="70" cy="275" rx="75" ry="16" fill="#604826" opacity="0.2" />

    <!-- Tail -->
    <path d="M125 150 C160 130 170 100 155 90 C145 95 140 115 115 140 Z" fill="#FFFFFF" stroke="#8D5B4C" stroke-width="1.5">
      <animateTransform attributeName="transform" type="rotate" values="0 120 145; 15 120 145; -10 120 145; 0 120 145" dur="1s" repeatCount="indefinite" />
    </path>

    <!-- Paws / Legs -->
    <rect x="25" y="190" width="22" height="85" rx="11" fill="#FFFFFF" stroke="#604826" stroke-opacity="0.15" stroke-width="1.5" />
    <rect x="65" y="190" width="22" height="85" rx="11" fill="#FFFFFF" stroke="#604826" stroke-opacity="0.15" stroke-width="1.5" />
    <rect x="15" y="180" width="20" height="80" rx="10" fill="#F0ECE1" />
    <rect x="95" y="180" width="20" height="80" rx="10" fill="#F0ECE1" />

    <!-- Paw Pads Toe details -->
    <ellipse cx="36" cy="275" rx="14" ry="8" fill="#FFFFFF" />
    <ellipse cx="76" cy="275" rx="14" ry="8" fill="#FFFFFF" />
    <circle cx="30" cy="278" r="3" fill="#8D5B4C" />
    <circle cx="36" cy="279" r="3" fill="#8D5B4C" />
    <circle cx="42" cy="278" r="3" fill="#8D5B4C" />

    <!-- Body -->
    <ellipse cx="65" cy="165" rx="60" ry="50" fill="#FFFFFF" stroke="#604826" stroke-opacity="0.15" stroke-width="1.5" />
    
    <!-- Big Brown Patch on back -->
    <path d="M40 125 C70 115 95 120 105 145 C100 175 60 180 45 160 Z" fill="#8D5B4C" />
    <!-- Secondary small patch -->
    <circle cx="35" cy="185" r="10" fill="#8D5B4C" />

    <!-- Head -->
    <circle cx="65" cy="85" r="46" fill="#FFFFFF" stroke="#604826" stroke-opacity="0.15" stroke-width="1.5" />

    <!-- Distinct Brown Patch around Left Eye & Ear -->
    <path d="M35 45 C55 35 85 45 80 80 C75 105 45 105 30 85 Z" fill="#8D5B4C" />

    <!-- Soft Drooping Ears -->
    <ellipse cx="22" cy="65" rx="14" ry="28" transform="rotate(-20 22 65)" fill="#8D5B4C" />
    <ellipse cx="108" cy="65" rx="14" ry="28" transform="rotate(20 108 65)" fill="#FFFFFF" stroke="#604826" stroke-opacity="0.15" stroke-width="1.5" />

    <!-- Big Sparkling Puppy Eyes -->
    <ellipse cx="50" cy="82" rx="9" ry="11" fill="#2C1A11" />
    <circle cx="47" cy="78" r="3.5" fill="#FFFFFF" />
    <circle cx="53" cy="86" r="1.5" fill="#FFFFFF" />

    <ellipse cx="80" cy="82" rx="9" ry="11" fill="#2C1A11" />
    <circle cx="77" cy="78" r="3.5" fill="#FFFFFF" />
    <circle cx="83" cy="86" r="1.5" fill="#FFFFFF" />

    <!-- Snout & Nose -->
    <ellipse cx="65" cy="102" rx="16" ry="12" fill="#FAF6EE" />
    <ellipse cx="65" cy="98" rx="8" ry="6" fill="#2C1A11" />
    <path d="M65 104 L65 110 M60 110 Q65 114 70 110" stroke="#2C1A11" stroke-width="2" stroke-linecap="round" />
    
    <!-- Happy Tongue -->
    <path d="M62 110 Q65 120 68 110 Z" fill="#D7685A" />
  </g>

  <!-- Color Palette Swatches at bottom -->
  <g transform="translate(30, 435)">
    <circle cx="20" cy="20" r="14" fill="#FFFFFF" stroke="#DDD" stroke-width="2" />
    <circle cx="58" cy="20" r="14" fill="#8D5B4C" />
    <circle cx="96" cy="20" r="14" fill="#3D2314" />
    <circle cx="134" cy="20" r="14" fill="#D7685A" />
    <circle cx="172" cy="20" r="14" fill="#2C1A11" />
    <text x="205" y="25" font-family="'Nunito', sans-serif" font-size="12" font-weight="600" fill="#604826">
      Bảng màu lông, đốm nâu &amp; mắt
    </text>
  </g>
</svg>
