<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 500" width="100%" height="100%">
  <defs>
    <linearGradient id="hl14Bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFDF9" />
      <stop offset="100%" stop-color="#FCE6AB" />
    </linearGradient>
  </defs>

  <rect width="400" height="500" rx="20" fill="url(#hl14Bg)" />

  <!-- Grid Guide background (Model sheet style) -->
  <g stroke="#604826" stroke-opacity="0.07" stroke-width="1">
    <line x1="40" y1="120" x2="360" y2="120" stroke-dasharray="4" />
    <line x1="40" y1="240" x2="360" y2="240" stroke-dasharray="4" />
    <line x1="40" y1="360" x2="360" y2="360" stroke-dasharray="4" />
    <line x1="40" y1="440" x2="360" y2="440" stroke-dasharray="4" />
  </g>

  <!-- Tag / Title in sheet -->
  <text x="30" y="45" font-family="'Quicksand', sans-serif" font-weight="700" font-size="18" fill="#604826">
    Hà Linh <tspan fill="#E67E22" font-size="15">(14 Tuổi)</tspan>
  </text>
  <text x="30" y="68" font-family="'Nunito', sans-serif" font-size="12" fill="#8B9DA8">
    Đặc điểm: Hồn nhiên, tinh nghịch, giàu cảm xúc
  </text>

  <!-- Character Full Body Front-3/4 View -->
  <g transform="translate(140, 70)">
    <!-- Shadow -->
    <ellipse cx="60" cy="385" rx="55" ry="12" fill="#604826" opacity="0.15" />

    <!-- Legs & Sandals -->
    <path d="M42 270 L38 370" stroke="#F5D0A9" stroke-width="16" stroke-linecap="round" />
    <path d="M78 270 L82 370" stroke="#F5D0A9" stroke-width="16" stroke-linecap="round" />
    <!-- Sandals (Dép quai) -->
    <path d="M25 375 C25 370 50 370 52 380 C52 385 25 385 25 375 Z" fill="#E67E22" />
    <path d="M70 375 C70 370 95 370 97 380 C97 385 70 385 70 375 Z" fill="#E67E22" />

    <!-- Shorts (Quần short xanh lục năng động) -->
    <path d="M28 205 C25 240 20 270 15 275 C30 278 55 278 60 265 C65 278 90 278 105 275 C100 270 95 240 92 205 Z" fill="#27AE60" />

    <!-- T-Shirt (Áo trắng thân giữa) -->
    <path d="M30 115 C25 150 25 190 28 210 C50 215 70 215 92 210 C95 190 95 150 90 115 Z" fill="#FFFFFF" stroke="#604826" stroke-opacity="0.15" stroke-width="1.5" />

    <!-- Orange Contrast Sleeves (Tay áo cam) -->
    <path d="M22 118 C10 130 5 150 15 160 C25 160 30 145 32 125 Z" fill="#E67E22" />
    <path d="M98 118 C110 130 115 150 105 160 C95 160 90 145 88 125 Z" fill="#E67E22" />

    <!-- Arms (Tay thon nhỏ tuổi thiếu niên) -->
    <path d="M15 160 C10 190 8 220 12 245" stroke="#F5D0A9" stroke-width="11" stroke-linecap="round" />
    <path d="M105 160 C110 190 112 220 108 245" stroke="#F5D0A9" stroke-width="11" stroke-linecap="round" />

    <!-- Head & Neck -->
    <rect x="52" y="90" width="16" height="28" rx="6" fill="#F5D0A9" />
    <circle cx="60" cy="70" r="32" fill="#FBD5B5" />
    
    <!-- Cheeks & Smile -->
    <circle cx="44" cy="78" r="6" fill="#F5A391" opacity="0.65" />
    <circle cx="76" cy="78" r="6" fill="#F5A391" opacity="0.65" />
    <path d="M46 68 Q52 62 58 68" fill="none" stroke="#50381E" stroke-width="3" stroke-linecap="round" />
    <path d="M64 68 Q70 62 76 68" fill="none" stroke="#50381E" stroke-width="3" stroke-linecap="round" />
    <path d="M52 82 Q60 92 68 82" fill="none" stroke="#D7685A" stroke-width="3" stroke-linecap="round" />

    <!-- Hair (Buộc hai bên hoặc đuôi ngựa gọn gàng) -->
    <path d="M30 65 C28 30 45 28 60 28 C85 28 92 40 90 75 C82 55 70 48 60 50 C46 48 38 55 30 65 Z" fill="#3D2918" />
    <path d="M26 55 C15 70 18 90 26 100 C24 85 22 75 26 55 Z" fill="#3D2918" />
    <path d="M94 55 C105 70 102 90 94 100 C96 85 98 75 94 55 Z" fill="#3D2918" />
  </g>

  <!-- Color Palette Swatches at bottom -->
  <g transform="translate(30, 435)">
    <circle cx="20" cy="20" r="14" fill="#FFFFFF" stroke="#DDD" stroke-width="2" />
    <circle cx="58" cy="20" r="14" fill="#E67E22" />
    <circle cx="96" cy="20" r="14" fill="#27AE60" />
    <circle cx="134" cy="20" r="14" fill="#F5D0A9" />
    <circle cx="172" cy="20" r="14" fill="#3D2918" />
    <text x="205" y="25" font-family="'Nunito', sans-serif" font-size="12" font-weight="600" fill="#604826">
      Bảng màu trang phục &amp; làn da
    </text>
  </g>
</svg>
