<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 500" width="100%" height="100%">
  <defs>
    <linearGradient id="hl21Bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFDF9" />
      <stop offset="100%" stop-color="#E2DCD2" />
    </linearGradient>
  </defs>

  <rect width="400" height="500" rx="20" fill="url(#hl21Bg)" />

  <!-- Grid Guide background (Model sheet style) -->
  <g stroke="#34425C" stroke-opacity="0.08" stroke-width="1">
    <line x1="40" y1="110" x2="360" y2="110" stroke-dasharray="4" />
    <line x1="40" y1="230" x2="360" y2="230" stroke-dasharray="4" />
    <line x1="40" y1="350" x2="360" y2="350" stroke-dasharray="4" />
    <line x1="40" y1="440" x2="360" y2="440" stroke-dasharray="4" />
  </g>

  <!-- Tag / Title in sheet -->
  <text x="30" y="45" font-family="'Quicksand', sans-serif" font-weight="700" font-size="18" fill="#34425C">
    Hà Linh <tspan fill="#4A7C59" font-size="15">(21 Tuổi)</tspan>
  </text>
  <text x="30" y="68" font-family="'Nunito', sans-serif" font-size="12" fill="#645F73">
    Đặc điểm: Trưởng thành, sống khép kín, tình nguyện viên trạm cứu hộ
  </text>

  <!-- Character Full Body -->
  <g transform="translate(140, 65)">
    <!-- Shadow -->
    <ellipse cx="60" cy="390" rx="55" ry="12" fill="#34425C" opacity="0.18" />

    <!-- Pants (Quần ống rộng màu be thời trang thanh lịch) -->
    <path d="M25 210 L15 375 L45 375 L55 250 L65 250 L75 375 L105 375 L95 210 Z" fill="#D9C5B2" />
    <!-- Shoes (Giày vải vintage) -->
    <ellipse cx="30" cy="380" rx="18" ry="6" fill="#604826" />
    <ellipse cx="90" cy="380" rx="18" ry="6" fill="#604826" />

    <!-- White Inner Shirt (Áo sơ mi dài tay bên trong) -->
    <path d="M30 115 L20 215 L32 215 L40 135 L80 135 L88 215 L100 215 L90 115 Z" fill="#FAF6EE" />
    <!-- Forearms & Hands -->
    <path d="M20 215 L22 255" stroke="#F5D0A9" stroke-width="10" stroke-linecap="round" />
    <path d="M100 215 L98 255" stroke="#F5D0A9" stroke-width="10" stroke-linecap="round" />

    <!-- Green Knit Vest (Áo len gile xanh rêu đặc trưng) -->
    <path d="M32 110 C28 145 28 185 30 210 C50 215 70 215 90 210 C92 185 92 145 88 110 L68 140 L60 110 L52 140 Z" fill="#4A7C59" stroke="#376043" stroke-width="1" />
    <!-- V-Neck line -->
    <polygon points="50,110 60,135 70,110" fill="#FAF6EE" />

    <!-- Head & Neck -->
    <rect x="52" y="85" width="16" height="28" rx="6" fill="#F5D0A9" />
    <circle cx="60" cy="65" r="30" fill="#FBD5B5" />

    <!-- Subtle gentle smile & thoughtful gaze -->
    <path d="M47 62 Q53 58 59 62" fill="none" stroke="#3D2918" stroke-width="2.5" stroke-linecap="round" />
    <path d="M63 62 Q69 58 75 62" fill="none" stroke="#3D2918" stroke-width="2.5" stroke-linecap="round" />
    <path d="M54 75 Q60 81 66 75" fill="none" stroke="#D7685A" stroke-width="2.5" stroke-linecap="round" />

    <!-- Adult Hairstyle (Tóc dài ngang vai buông xõa tự nhiên) -->
    <path d="M28 60 C26 25 45 22 60 22 C85 22 92 35 92 68 C84 48 72 44 60 45 C45 44 36 48 28 60 Z" fill="#2E1F13" />
    <!-- Side hair falling on shoulders -->
    <path d="M28 55 C22 75 22 105 28 135 C32 105 32 80 30 55 Z" fill="#2E1F13" />
    <path d="M92 55 C98 75 98 105 92 135 C88 105 88 80 90 55 Z" fill="#2E1F13" />
  </g>

  <!-- Color Palette Swatches at bottom -->
  <g transform="translate(30, 435)">
    <circle cx="20" cy="20" r="14" fill="#4A7C59" />
    <circle cx="58" cy="20" r="14" fill="#D9C5B2" />
    <circle cx="96" cy="20" r="14" fill="#FAF6EE" stroke="#CCC" stroke-width="1" />
    <circle cx="134" cy="20" r="14" fill="#604826" />
    <circle cx="172" cy="20" r="14" fill="#2E1F13" />
    <text x="205" y="25" font-family="'Nunito', sans-serif" font-size="12" font-weight="600" fill="#34425C">
      Bảng màu trang phục trưởng thành
    </text>
  </g>
</svg>

