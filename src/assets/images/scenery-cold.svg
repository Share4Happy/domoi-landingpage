<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" width="100%" height="100%">
  <defs>
    <linearGradient id="coldBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1E2738" />
      <stop offset="50%" stop-color="#34425C" />
      <stop offset="100%" stop-color="#232C3E" />
    </linearGradient>
    <linearGradient id="lightBeam" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F3D082" stop-opacity="0.5" />
      <stop offset="100%" stop-color="#F3D082" stop-opacity="0" />
    </linearGradient>
  </defs>
  <!-- Dark Cold Room Background -->
  <rect width="640" height="360" fill="url(#coldBg)" />

  <!-- Cage Iron Bars -->
  <g stroke="#18202E" stroke-width="8" opacity="0.9">
    <line x1="80" y1="0" x2="80" y2="360" />
    <line x1="160" y1="0" x2="160" y2="360" />
    <line x1="240" y1="0" x2="240" y2="360" />
    <line x1="320" y1="0" x2="320" y2="360" />
    <line x1="400" y1="0" x2="400" y2="360" />
    <line x1="480" y1="0" x2="480" y2="360" />
    <line x1="560" y1="0" x2="560" y2="360" />
    <!-- Horizontal Crossbars -->
    <line x1="0" y1="90" x2="640" y2="90" stroke-width="12" />
    <line x1="0" y1="270" x2="640" y2="270" stroke-width="12" />
  </g>

  <!-- Small ray of hope cutting through -->
  <polygon points="50,0 120,0 380,360 220,360" fill="url(#lightBeam)" />

  <!-- Dog silhouette sitting alone inside -->
  <g transform="translate(260, 230)" opacity="0.6">
    <ellipse cx="25" cy="45" rx="30" ry="15" fill="#141A25" />
    <ellipse cx="20" cy="25" rx="18" ry="14" fill="#141A25" />
    <circle cx="30" cy="10" r="12" fill="#141A25" />
    <!-- Drooping ears -->
    <path d="M22 6 C16 12 18 20 20 24" stroke="#141A25" stroke-width="4" stroke-linecap="round" />
  </g>

  <text x="320" y="340" font-family="'Quicksand', sans-serif" font-weight="700" font-size="16" fill="#8B9DA8" text-anchor="middle">
    Căn phòng giam &amp; Khoảng lặng biến cố
  </text>
</svg>

