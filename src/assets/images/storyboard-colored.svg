<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="scBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FDF4DE" />
      <stop offset="50%" stop-color="#FBE0A6" />
      <stop offset="100%" stop-color="#CDCD74" />
    </linearGradient>
    <linearGradient id="hillC" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#CDCD74" />
      <stop offset="100%" stop-color="#8A8B47" />
    </linearGradient>
    <radialGradient id="sunC" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFF8E0" />
      <stop offset="100%" stop-color="#F3D082" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- Sky & Landscape -->
  <rect width="800" height="450" fill="url(#scBg)" />
  <circle cx="680" cy="90" r="140" fill="url(#sunC)" />

  <!-- Storyboard Film Frame Mask -->
  <rect x="30" y="30" width="740" height="390" fill="none" stroke="#604826" stroke-width="2" />
  <line x1="30" y1="70" x2="770" y2="70" stroke="#604826" stroke-width="1.5" />
  
  <text x="50" y="58" font-family="'Courier New', monospace" font-size="18" font-weight="bold" fill="#604826">
    PROJECT: DOM OI · SCENE 01 / CUT 03 · FINAL COMPOSITING
  </text>
  <text x="750" y="58" font-family="'Courier New', monospace" font-size="14" font-weight="bold" fill="#27AE60" text-anchor="end">
    [FINAL RENDER]
  </text>

  <!-- Content Scene Colored -->
  <g transform="translate(60, 40)">
    <!-- Distant hills -->
    <path d="M0 260 Q200 230 400 250 Q600 270 700 240 L700 370 L0 370 Z" fill="url(#hillC)" />
    
    <!-- Big Tree on right -->
    <path d="M570 370 C560 260 590 180 570 120 C590 150 630 260 640 370 Z" fill="#694625" />
    <circle cx="560" cy="110" r="70" fill="#84A034" opacity="0.95" />
    <circle cx="620" cy="90" r="60" fill="#9CBD3B" opacity="0.9" />

    <!-- Cardboard Box painted -->
    <polygon points="120,250 200,220 260,240 180,270" fill="#DEB07D" />
    <polygon points="120,250 180,270 180,330 120,310" fill="#CB9C68" />
    <polygon points="180,270 260,240 260,300 180,330" fill="#9C6F3D" />

    <!-- Hà Linh Fully Rendered -->
    <g transform="translate(320, 160)">
      <!-- Shadow -->
      <ellipse cx="40" cy="180" rx="45" ry="10" fill="#4B5B1E" opacity="0.35" />
      <!-- Shorts & legs -->
      <path d="M15 125 L35 125 L45 175 L20 175 Z" fill="#27AE60" />
      <!-- T-Shirt & Orange sleeves -->
      <path d="M15 65 L65 65 L55 130 L20 130 Z" fill="#FFFFFF" />
      <path d="M10 65 L2 95 L18 95 L22 75 Z" fill="#E67E22" />
      <path d="M60 65 L72 95 L58 95 L54 75 Z" fill="#E67E22" />
      <!-- Arm reaching -->
      <path d="M5 95 C-25 110 -60 125 -80 130" stroke="#F5D0A9" stroke-width="10" stroke-linecap="round" fill="none" />
      <!-- Head & Hair -->
      <circle cx="38" cy="40" r="24" fill="#FBD5B5" />
      <path d="M16 38 C14 15 28 12 38 12 C58 12 62 22 60 48 C54 34 46 28 38 30 C28 28 22 34 16 38 Z" fill="#3D2918" />
      <circle cx="30" cy="42" r="3" fill="#D7685A" />
      <!-- Smile -->
      <path d="M32 46 Q38 52 44 46" stroke="#D7685A" stroke-width="2" fill="none" stroke-linecap="round" />
    </g>

    <!-- Đốm Fully Rendered -->
    <g transform="translate(195, 250)">
      <!-- Dog shadow -->
      <ellipse cx="25" cy="55" rx="30" ry="8" fill="#4B5B1E" opacity="0.35" />
      <!-- Body & Tail -->
      <path d="M-10 25 C-25 15 -25 5 -15 5 C-8 10 -5 18 2 22 Z" fill="#FFFFFF" />
      <ellipse cx="20" cy="30" rx="24" ry="18" fill="#FFFFFF" />
      <circle cx="15" cy="22" r="9" fill="#8D5B4C" />
      <!-- Paws -->
      <rect x="8" y="42" width="6" height="14" rx="3" fill="#FFFFFF" />
      <rect x="25" y="42" width="6" height="14" rx="3" fill="#FFFFFF" />
      <!-- Head & Eye patch -->
      <circle cx="40" cy="18" r="16" fill="#FFFFFF" />
      <path d="M30 6 C42 0 52 8 48 24 C44 32 30 28 26 18 Z" fill="#8D5B4C" />
      <circle cx="35" cy="16" r="3" fill="#2C1A11" />
      <circle cx="36" cy="15" r="1" fill="#FFFFFF" />
      <ellipse cx="44" cy="22" rx="3" ry="2" fill="#2C1A11" />
    </g>

    <text x="340" y="380" font-family="'Courier New', monospace" font-size="13" font-weight="bold" fill="#27AE60" text-anchor="middle">
      RENDER PASS 04: HOÀN THIỆN MÀU NƯỚC, DIỄN HOẠT VÀ CHI TIẾT
    </text>
  </g>
</svg>

